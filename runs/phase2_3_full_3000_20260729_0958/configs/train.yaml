# Phase 2.3 Full 3000: Full 2000 LoRA warm-start with a new classifier head.
defaults:
  backbone_name: smolvlm-500m
  dtype: float32
  device: cpu
  quantization: null
  gradient_checkpointing: true

lora:
  r: 32
  alpha: 64
  dropout: 0.10
  target: q_proj,k_proj,v_proj,o_proj

training:
  epochs: 1
  max_train_records: 3000
  max_val_records: 150
  max_train_steps: 3000
  batch_size: 1
  lr: 2.0e-5
  head_lr: 1.0e-4
  weight_decay: 0.0
  class_weighted: false
  early_stop_patience: 3
  log_every: 5
  save_every: 50
  partial_name: lora_phase2_3_full_3000_latest.safetensors
  checkpoint_name: lora_phase2_3_full_3000.safetensors
  eval_after_epoch: false
  seed: 43
  preload_dataset: false
  dataset_cache_size: 8
  max_train_seconds: 0.0
  init_from: ../../phase2_3_full_2000_20260727_1211/artifacts/checkpoints/checkpoint_step_2000.safetensors
  warmup_head_steps: 400

io:
  train_jsonl: ../data/train.jsonl
  val_jsonl: ../data/compare_quick_all.jsonl
  out_dir: ../artifacts/checkpoints

phase2_3_full_3000:
  run_name: phase2_3_full_3000_20260729_0958
  objective: mixed_clean_direct_indirect_f1_gt_0_70_with_direct_retention
  prompt_version: trusted_boundary_v2
  initialization: full_2000_lora_only_new_head_new_optimizer
  baseline_checkpoint: ../../phase2_3_full_2000_20260727_1211/artifacts/checkpoints/checkpoint_step_2000.safetensors

compare:
  quick:
    sets:
      all: ../data/compare_quick_all.jsonl
    schedule_steps: [300, 750, 2250]
    log_every_samples: 5
  full:
    sets:
      all: ../data/compare_full_all.jsonl
    schedule_steps: [1500, 3000]
    log_every_samples: 5

checkpoint_policy:
  save_every_steps: 50
  latest_name: latest.safetensors
  step_name_pattern: checkpoint_step_{step}.safetensors
  best_name: lora_phase2_3_full_3000_best_by_min_class_f1.safetensors
  selection_metric: min(clean_f1, direct_f1, indirect_f1)
  direct_recall_floor: 0.95
  direct_f1_floor: 0.85
